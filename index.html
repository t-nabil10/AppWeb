<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi Heures &amp; Revenus</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link href="styles.css" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1E2A52">
<link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
<aside id="sidebar">
  <div class="brand"><i class="fa-solid fa-graduation-cap"></i> <span id="brandName">Mon École</span></div>
  <nav id="nav">
    <a data-p="dashboard"><i class="fa-solid fa-chart-pie"></i> Tableau de bord</a>
    <a data-p="monthly"><i class="fa-solid fa-calendar-days"></i> Suivi mensuel</a>
    <a data-p="daily"><i class="fa-solid fa-clock"></i> Heures quotidiennes</a>
    <a data-p="annual"><i class="fa-solid fa-file-invoice-dollar"></i> Rapports annuels</a>
    <a data-p="settings"><i class="fa-solid fa-gear"></i> Paramètres</a>
    <a data-p="backup"><i class="fa-solid fa-database"></i> Sauvegarde</a>
  </nav>
</aside>
<main>
  <header class="topbar">
    <button class="btn btn-light d-lg-none" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
    <span id="today"></span>
    <span class="ms-auto">Année : <select id="yearSel" class="form-select form-select-sm d-inline-block w-auto"></select></span>
  </header>
  <section id="view" class="p-3 p-lg-4"></section>
</main>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
